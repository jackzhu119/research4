[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herb-spectra-research"
version = "0.1.0"
description = "Auditable baselines for medicinal-plant spectroscopy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]
